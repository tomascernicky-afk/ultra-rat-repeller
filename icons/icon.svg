<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141928"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f283e" stroke-width="4"/>

  <!-- Radar concentric wave rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="3"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="3"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="rgba(0, 240, 255, 0.6)" stroke-width="3"/>

  <!-- Ultrasonic Wave Emitter Beams -->
  <path d="M256 60 L256 120 M256 392 L256 452 M60 256 L120 256 M392 256 L452 256" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M117 117 L160 160 M352 352 L395 395 M117 395 L160 352 M352 160 L395 117" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Core Pulsing Crystal Center -->
  <circle cx="256" cy="256" r="26" fill="url(#neonGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
